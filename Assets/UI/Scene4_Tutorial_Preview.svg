<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c0e04"/>
      <stop offset="100%" stop-color="#0d0602"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#281608" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#160c04" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca6f1e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e67e22"/>
      <stop offset="80%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#ca6f1e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#935116"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#e67e22" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="660" fill="url(#bgGrad)"/>
  <g opacity="0.035" stroke="#e59866" stroke-width="1">
    <line x1="0" y1="110" x2="900" y2="110"/><line x1="0" y1="220" x2="900" y2="220"/>
    <line x1="0" y1="330" x2="900" y2="330"/><line x1="0" y1="440" x2="900" y2="440"/>
    <line x1="0" y1="550" x2="900" y2="550"/>
    <line x1="180" y1="0" x2="180" y2="660"/><line x1="360" y1="0" x2="360" y2="660"/>
    <line x1="540" y1="0" x2="540" y2="660"/><line x1="720" y1="0" x2="720" y2="660"/>
  </g>
  <circle cx="165" cy="70" r="3" fill="#e67e22" opacity="0.4"/>
  <circle cx="735" cy="70" r="3" fill="#e67e22" opacity="0.4"/>

  <rect x="145" y="50" width="610" height="560" rx="22" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="145" y="50" width="610" height="4" rx="2" fill="url(#accentLine)"/>
  <rect x="145" y="50" width="610" height="560" rx="22" fill="none" stroke="#e67e22" stroke-width="1.2" stroke-opacity="0.25"/>
  <rect x="152" y="57" width="596" height="546" rx="18" fill="none" stroke="#e67e22" stroke-width="0.5" stroke-opacity="0.1"/>

  <rect x="280" y="58" width="340" height="28" rx="14" fill="#7d4e12" opacity="0.95"/>
  <text x="450" y="77" text-anchor="middle" fill="#f0b27a" font-size="12" font-weight="700" letter-spacing="1.5">TÌNH HUỐNG KHUẤT TẦM NHÌN</text>
  <rect x="153" y="58" width="95" height="28" rx="6" fill="#2a1608"/>
  <rect x="153" y="58" width="95" height="28" rx="6" fill="none" stroke="#e67e22" stroke-width="1" stroke-opacity="0.5"/>
  <text x="200" y="77" text-anchor="middle" fill="#e67e22" font-size="13" font-weight="800" letter-spacing="1">SCENE 04</text>

  <!-- Icon -->
  <circle cx="450" cy="172" r="70" fill="url(#iconGlow)"/>
  <circle cx="450" cy="172" r="55" fill="url(#iconBg)" filter="url(#glowSoft)"/>
  <circle cx="450" cy="172" r="55" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="450" cy="172" r="65" fill="none" stroke="#e67e22" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="5,5"/>
  <rect x="428" y="150" width="32" height="20" rx="4" fill="none" stroke="white" stroke-width="2.5"/>
  <rect x="431" y="153" width="10" height="8" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="445" y="153" width="10" height="8" rx="1.5" fill="white" opacity="0.4"/>
  <circle cx="432" cy="172" r="3.5" fill="white"/>
  <circle cx="456" cy="172" r="3.5" fill="white"/>
  <line x1="426" y1="147" x2="463" y2="176" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#glowSoft)"/>
  <line x1="463" y1="147" x2="426" y2="176" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#glowSoft)"/>
  <ellipse cx="416" cy="163" rx="15" ry="18" fill="#e67e22" opacity="0.15" filter="url(#glowSoft)"/>
  <text x="416" y="168" text-anchor="middle" fill="#f0b27a" font-size="20" font-weight="900" filter="url(#glowSoft)">?</text>
  <rect x="439" y="182" width="20" height="12" rx="3" fill="none" stroke="white" stroke-width="1.8" stroke-dasharray="4,2" opacity="0.7"/>
  <line x1="449" y1="196" x2="449" y2="205" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,2" opacity="0.8"/>

  <text x="450" y="258" text-anchor="middle" fill="#e67e22" font-size="19" font-weight="800" letter-spacing="2" filter="url(#glowSoft)">ĐIỂM MÙ — XE ĐỖ TRÁI PHÉP CHE KHUẤT</text>
  <line x1="220" y1="270" x2="680" y2="270" stroke="url(#accentLine)" stroke-width="1"/>

  <!-- Mục 1 -->
  <rect x="190" y="284" width="32" height="32" rx="8" fill="#2a1005" stroke="#e67e22" stroke-width="1.5"/>
  <text x="206" y="305" text-anchor="middle" fill="#e67e22" font-size="14" font-weight="900">!</text>
  <rect x="234" y="284" width="430" height="32" rx="8" fill="#1e1005" stroke="#ca6f1e" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="305" fill="#f0b27a" font-size="13.5">
    <tspan font-weight="600">Xe đỗ </tspan><tspan fill="#e74c3c" font-weight="700">trái phép</tspan><tspan font-weight="600"> che khuất tầm nhìn của bạn</tspan>
  </text>

  <!-- Mục 2 -->
  <rect x="190" y="326" width="32" height="32" rx="8" fill="#2a1005" stroke="#f39c12" stroke-width="1.5"/>
  <text x="206" y="347" text-anchor="middle" fill="#f39c12" font-size="16" font-weight="900">↓</text>
  <rect x="234" y="326" width="430" height="32" rx="8" fill="#1a1005" stroke="#d4a017" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="347" fill="#f0b27a" font-size="13.5">
    <tspan font-weight="600">Giảm tốc độ </tspan><tspan fill="#f39c12" font-weight="700">khi tiếp cận</tspan><tspan font-weight="600"> điểm khuất tầm nhìn</tspan>
  </text>

  <!-- Mục 3 -->
  <rect x="190" y="368" width="32" height="32" rx="8" fill="#2a1005" stroke="#e67e22" stroke-width="1.5"/>
  <text x="206" y="389" text-anchor="middle" fill="#f0b27a" font-size="16">👁</text>
  <rect x="234" y="368" width="430" height="32" rx="8" fill="#1a1005" stroke="#ca6f1e" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="389" fill="#f0b27a" font-size="13.5">
    <tspan font-weight="600">Quan sát kỹ </tspan><tspan fill="#e67e22" font-weight="700">hai phía</tspan><tspan font-weight="600"> trước khi vượt qua điểm mù</tspan>
  </text>

  <!-- Mục 4 -->
  <rect x="190" y="410" width="32" height="32" rx="8" fill="#2a0a0a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="206" y="431" text-anchor="middle" fill="#e74c3c" font-size="15" font-weight="900">✕</text>
  <rect x="234" y="410" width="430" height="32" rx="8" fill="#1a0808" stroke="#c0392b" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="431" fill="#f0b27a" font-size="13.5">
    <tspan font-weight="600">Không </tspan><tspan fill="#e74c3c" font-weight="700">lao ra ẩu</tspan><tspan font-weight="600"> — phương tiện ngược chiều rất nguy hiểm</tspan>
  </text>

  <!-- Hộp điều luật -->
  <rect x="190" y="456" width="520" height="62" rx="12" fill="#0d0702" stroke="#e67e22" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="190" y="456" width="4" height="62" rx="2" fill="#e67e22" opacity="0.9"/>
  <text x="450" y="475" text-anchor="middle" fill="#f0b27a" font-size="11" font-weight="700" letter-spacing="1.5">CƠ SỞ PHÁP LÝ — LUẬT 36/2024/QH15</text>
  <text x="225" y="491" fill="#c9966b" font-size="13">
    <tspan fill="white" font-size="18" font-weight="900" letter-spacing="1.5">ĐIỀU 18</tspan><tspan> — Dừng xe, đỗ xe trái phép gây cản trở</tspan>
  </text>
  <text x="225" y="510" fill="#c9966b" font-size="13">
    <tspan fill="white" font-size="18" font-weight="900" letter-spacing="1.5">ĐIỀU 19</tspan><tspan> — Nghĩa vụ quan sát khi mở cửa xe</tspan>
  </text>

  <!-- Nút bắt đầu -->
  <rect x="190" y="532" width="520" height="48" rx="12" fill="#07150a" stroke="#2ecc71" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="190" y="532" width="520" height="48" rx="12" fill="none" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="10,6"/>
  <rect x="210" y="542" width="32" height="28" rx="7" fill="#0d2e12" stroke="#2ecc71" stroke-width="2"/>
  <text x="226" y="561" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="900">1</text>
  <text x="454" y="562" text-anchor="middle" fill="white" font-size="15" font-weight="700" letter-spacing="1">Nhấn 1 khi sẵn sàng bắt đầu</text>
  <text x="686" y="562" text-anchor="middle" fill="#2ecc71" font-size="22" filter="url(#glowSoft)">▶</text>

  <text x="450" y="628" text-anchor="middle" fill="#2e1808" font-size="12">VR Smart Traffic Instructor — Scene 4 · Khuất tầm nhìn và xe đỗ trái phép</text>
</svg>
