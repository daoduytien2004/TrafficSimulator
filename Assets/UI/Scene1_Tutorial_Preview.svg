<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f1d2e"/>
      <stop offset="100%" stop-color="#050c14"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102035" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#071220" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2980b9" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3498db"/>
      <stop offset="80%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2e86c1"/>
      <stop offset="100%" stop-color="#154360"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3498db" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#2e86c1"/>
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52be80"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec7063"/>
      <stop offset="100%" stop-color="#cb4335"/>
    </linearGradient>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#3498db" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="660" fill="url(#bgGrad)"/>
  <g opacity="0.035" stroke="#8fb8d8" stroke-width="1">
    <line x1="0" y1="110" x2="900" y2="110"/><line x1="0" y1="220" x2="900" y2="220"/>
    <line x1="0" y1="330" x2="900" y2="330"/><line x1="0" y1="440" x2="900" y2="440"/>
    <line x1="0" y1="550" x2="900" y2="550"/>
    <line x1="180" y1="0" x2="180" y2="660"/><line x1="360" y1="0" x2="360" y2="660"/>
    <line x1="540" y1="0" x2="540" y2="660"/><line x1="720" y1="0" x2="720" y2="660"/>
  </g>
  <circle cx="165" cy="70" r="3" fill="#3498db" opacity="0.4"/>
  <circle cx="735" cy="70" r="3" fill="#3498db" opacity="0.4"/>

  <rect x="145" y="50" width="610" height="560" rx="22" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="145" y="50" width="610" height="4" rx="2" fill="url(#accentLine)"/>
  <rect x="145" y="50" width="610" height="560" rx="22" fill="none" stroke="#3498db" stroke-width="1.2" stroke-opacity="0.25"/>
  <rect x="152" y="57" width="596" height="546" rx="18" fill="none" stroke="#3498db" stroke-width="0.5" stroke-opacity="0.1"/>

  <rect x="300" y="58" width="300" height="28" rx="14" fill="#1a4a6e" opacity="0.95"/>
  <text x="450" y="77" text-anchor="middle" fill="#aed6f1" font-size="12" font-weight="700" letter-spacing="1.5">HƯỚNG DẪN ĐIỀU KHIỂN XE</text>
  <rect x="153" y="58" width="95" height="28" rx="6" fill="#1c3a52"/>
  <rect x="153" y="58" width="95" height="28" rx="6" fill="none" stroke="#3498db" stroke-width="1" stroke-opacity="0.5"/>
  <text x="200" y="77" text-anchor="middle" fill="#3498db" font-size="13" font-weight="800" letter-spacing="1">SCENE 01</text>

  <!-- Icon -->
  <circle cx="450" cy="172" r="70" fill="url(#iconGlow)"/>
  <circle cx="450" cy="172" r="55" fill="url(#iconBg)" filter="url(#glowSoft)"/>
  <circle cx="450" cy="172" r="55" fill="none" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="450" cy="172" r="65" fill="none" stroke="#3498db" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="5,5"/>
  <circle cx="450" cy="172" r="34" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="450" cy="172" r="9" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="450" cy="172" r="3.5" fill="white"/>
  <line x1="450" y1="138" x2="450" y2="163" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="421" y1="190" x2="441" y2="180" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="479" y1="190" x2="459" y2="180" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <rect x="388" y="209" width="26" height="18" rx="4" fill="url(#nGrad)" opacity="0.9"/>
  <text x="401" y="222" text-anchor="middle" fill="white" font-size="11" font-weight="900">N</text>
  <rect x="437" y="209" width="26" height="18" rx="4" fill="url(#dGrad)" opacity="0.9"/>
  <text x="450" y="222" text-anchor="middle" fill="white" font-size="11" font-weight="900">D</text>
  <rect x="486" y="209" width="26" height="18" rx="4" fill="url(#rGrad)" opacity="0.9"/>
  <text x="499" y="222" text-anchor="middle" fill="white" font-size="11" font-weight="900">R</text>

  <text x="450" y="258" text-anchor="middle" fill="#3498db" font-size="20" font-weight="800" letter-spacing="2" filter="url(#glowSoft)">HỌC LÁI XE TRONG MÔI TRƯỜNG VR</text>
  <line x1="220" y1="270" x2="680" y2="270" stroke="url(#accentLine)" stroke-width="1"/>

  <!-- Mục 1 — Số N -->
  <rect x="190" y="284" width="32" height="32" rx="8" fill="url(#nGrad)"/>
  <text x="206" y="305" text-anchor="middle" fill="white" font-size="14" font-weight="900">N</text>
  <rect x="234" y="284" width="430" height="32" rx="8" fill="#0a1e30" stroke="#2980b9" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="252" y="305" fill="#aed6f1" font-size="13.5">
    <tspan font-weight="600">Số </tspan><tspan fill="#7fb3d3" font-weight="700">N (Neutral)</tspan><tspan fill="#aed6f1" font-weight="600"> — xe đứng yên, chờ tín hiệu</tspan>
  </text>

  <!-- Mục 2 — Số D -->
  <rect x="190" y="326" width="32" height="32" rx="8" fill="url(#dGrad)"/>
  <text x="206" y="347" text-anchor="middle" fill="white" font-size="14" font-weight="900">D</text>
  <rect x="234" y="326" width="430" height="32" rx="8" fill="#0a1e12" stroke="#1e8449" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="252" y="347" fill="#aed6f1" font-size="13.5">
    <tspan font-weight="600">Số </tspan><tspan fill="#52be80" font-weight="700">D (Drive)</tspan><tspan font-weight="600"> — tiến về phía trước</tspan>
  </text>

  <!-- Mục 3 — Số R -->
  <rect x="190" y="368" width="32" height="32" rx="8" fill="url(#rGrad)"/>
  <text x="206" y="389" text-anchor="middle" fill="white" font-size="14" font-weight="900">R</text>
  <rect x="234" y="368" width="430" height="32" rx="8" fill="#1e0a0a" stroke="#cb4335" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="252" y="389" fill="#aed6f1" font-size="13.5">
    <tspan font-weight="600">Số </tspan><tspan fill="#ec7063" font-weight="700">R (Reverse)</tspan><tspan font-weight="600"> — lùi về phía sau</tspan>
  </text>

  <!-- Mục 4 — Ga & Phanh -->
  <rect x="190" y="410" width="32" height="32" rx="8" fill="#1a4a1a" stroke="#f39c12" stroke-width="1.5"/>
  <text x="206" y="431" text-anchor="middle" fill="#f39c12" font-size="16" font-weight="900">!</text>
  <rect x="234" y="410" width="430" height="32" rx="8" fill="#1a1505" stroke="#d4a017" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="431" fill="#aed6f1" font-size="13.5">
    <tspan font-weight="600">Bàn đạp </tspan><tspan fill="#f39c12" font-weight="700">ga</tspan><tspan fill="#7f8c8d"> → tăng tốc  |  </tspan><tspan fill="#ec7063" font-weight="700">phanh</tspan><tspan fill="#7f8c8d"> → giảm tốc</tspan>
  </text>

  <!-- Hộp mẹo -->
  <rect x="190" y="456" width="520" height="62" rx="12" fill="#071828" stroke="#3498db" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="190" y="456" width="4" height="62" rx="2" fill="#3498db" opacity="0.8"/>
  <text x="450" y="476" text-anchor="middle" fill="#5dade2" font-size="11" font-weight="700" letter-spacing="1.5">MẸO KỸ NĂNG</text>
  <text x="207" y="496" fill="#d6eaf8" font-size="13.5">
    <tspan font-weight="600">Luôn nhìn </tspan><tspan fill="#3498db" font-weight="700">gương chiếu hậu</tspan><tspan font-weight="600"> trước khi chuyển số hoặc di chuyển</tspan>
  </text>
  <text x="207" y="512" fill="#85929e" font-size="12">Đảm bảo không có chướng ngại vật phía sau trước khi tiến hoặc lùi</text>

  <!-- Nút bắt đầu -->
  <rect x="190" y="532" width="520" height="48" rx="12" fill="#07150a" stroke="#2ecc71" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="190" y="532" width="520" height="48" rx="12" fill="none" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="10,6"/>
  <rect x="210" y="542" width="32" height="28" rx="7" fill="#0d2e12" stroke="#2ecc71" stroke-width="2"/>
  <text x="226" y="561" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="900">1</text>
  <text x="454" y="562" text-anchor="middle" fill="white" font-size="15" font-weight="700" letter-spacing="1">Nhấn 1 khi sẵn sàng bắt đầu</text>
  <text x="686" y="562" text-anchor="middle" fill="#2ecc71" font-size="22" filter="url(#glowSoft)">▶</text>

  <text x="450" y="628" text-anchor="middle" fill="#2d4a5e" font-size="12">VR Smart Traffic Instructor — Scene 1 · Hướng dẫn cơ bản</text>
</svg>
