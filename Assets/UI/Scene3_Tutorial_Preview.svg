<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#110820"/>
      <stop offset="100%" stop-color="#07040f"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a102e" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0c071e" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e44ad" stop-opacity="0"/>
      <stop offset="20%" stop-color="#9b59b6"/>
      <stop offset="80%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#8e44ad" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#5b2c6f"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#9b59b6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="660" fill="url(#bgGrad)"/>
  <g opacity="0.035" stroke="#c39bd3" stroke-width="1">
    <line x1="0" y1="110" x2="900" y2="110"/><line x1="0" y1="220" x2="900" y2="220"/>
    <line x1="0" y1="330" x2="900" y2="330"/><line x1="0" y1="440" x2="900" y2="440"/>
    <line x1="0" y1="550" x2="900" y2="550"/>
    <line x1="180" y1="0" x2="180" y2="660"/><line x1="360" y1="0" x2="360" y2="660"/>
    <line x1="540" y1="0" x2="540" y2="660"/><line x1="720" y1="0" x2="720" y2="660"/>
  </g>
  <circle cx="165" cy="70" r="3" fill="#9b59b6" opacity="0.4"/>
  <circle cx="735" cy="70" r="3" fill="#9b59b6" opacity="0.4"/>

  <rect x="145" y="50" width="610" height="560" rx="22" fill="url(#panelGrad)" filter="url(#shadow)"/>
  <rect x="145" y="50" width="610" height="4" rx="2" fill="url(#accentLine)"/>
  <rect x="145" y="50" width="610" height="560" rx="22" fill="none" stroke="#9b59b6" stroke-width="1.2" stroke-opacity="0.25"/>
  <rect x="152" y="57" width="596" height="546" rx="18" fill="none" stroke="#9b59b6" stroke-width="0.5" stroke-opacity="0.1"/>

  <rect x="265" y="58" width="370" height="28" rx="14" fill="#4a1e6a" opacity="0.95"/>
  <text x="450" y="77" text-anchor="middle" fill="#d2b4de" font-size="12" font-weight="700" letter-spacing="1.5">XI-NHAN + KIỂM TRA GƯƠNG TRƯỚC KHI RẼ</text>
  <rect x="153" y="58" width="95" height="28" rx="6" fill="#2a1040"/>
  <rect x="153" y="58" width="95" height="28" rx="6" fill="none" stroke="#9b59b6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="200" y="77" text-anchor="middle" fill="#9b59b6" font-size="13" font-weight="800" letter-spacing="1">SCENE 03</text>

  <!-- Icon -->
  <circle cx="450" cy="172" r="70" fill="url(#iconGlow)"/>
  <circle cx="450" cy="172" r="55" fill="url(#iconBg)" filter="url(#glowSoft)"/>
  <circle cx="450" cy="172" r="55" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="450" cy="172" r="65" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="5,5"/>
  <path d="M 462 155 L 447 155 L 447 145 L 430 162 L 447 179 L 447 169 L 462 169 L 462 188 L 474 188 L 474 155 Z"
        fill="none" stroke="white" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="428" y="142" width="10" height="6" rx="3" fill="#f39c12" opacity="0.95" filter="url(#glowSoft)"/>
  <rect x="428" y="175" width="10" height="6" rx="3" fill="#f39c12" opacity="0.5"/>
  <ellipse cx="480" cy="160" rx="8" ry="11" fill="none" stroke="white" stroke-width="2.2"/>
  <ellipse cx="480" cy="160" rx="5" ry="7" fill="white" opacity="0.18"/>
  <line x1="480" y1="149" x2="480" y2="146" stroke="white" stroke-width="2"/>
  <rect x="476" y="156" width="8" height="5" rx="1" fill="white" opacity="0.35"/>

  <text x="450" y="258" text-anchor="middle" fill="#9b59b6" font-size="19" font-weight="800" letter-spacing="2" filter="url(#glowSoft)">BẬT XI-NHAN — KIỂM TRA GƯƠNG TRƯỚC KHI RẼ</text>
  <line x1="220" y1="270" x2="680" y2="270" stroke="url(#accentLine)" stroke-width="1"/>

  <!-- Mục 1 -->
  <rect x="190" y="284" width="32" height="32" rx="8" fill="#2a1040" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="206" y="305" text-anchor="middle" fill="#d2b4de" font-size="16">👁</text>
  <rect x="234" y="284" width="430" height="32" rx="8" fill="#150c25" stroke="#8e44ad" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="305" fill="#d7bde2" font-size="13.5">
    <tspan font-weight="600">Nhìn </tspan><tspan fill="#c39bd3" font-weight="700">gương chiếu hậu</tspan><tspan font-weight="600"> trái và phải</tspan>
  </text>

  <!-- Mục 2 -->
  <rect x="190" y="326" width="32" height="32" rx="8" fill="#2a1e08" stroke="#f39c12" stroke-width="1.5"/>
  <text x="206" y="347" text-anchor="middle" fill="#f39c12" font-size="18" font-weight="900">↰</text>
  <rect x="234" y="326" width="430" height="32" rx="8" fill="#1a1408" stroke="#d4a017" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="347" fill="#d7bde2" font-size="13.5">
    <tspan font-weight="600">Bật </tspan><tspan fill="#f39c12" font-weight="700">xi-nhan đúng hướng</tspan><tspan font-weight="600"> trước khi rẽ</tspan>
  </text>

  <!-- Mục 3 -->
  <rect x="190" y="368" width="32" height="32" rx="8" fill="#2a0a0a" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="206" y="389" text-anchor="middle" fill="#e74c3c" font-size="14" font-weight="900">!</text>
  <rect x="234" y="368" width="430" height="32" rx="8" fill="#180808" stroke="#c0392b" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="389" fill="#d7bde2" font-size="13.5">
    <tspan font-weight="600">Xe máy phía sau xuất hiện </tspan><tspan fill="#e74c3c" font-weight="700">→ nhường đường</tspan>
  </text>

  <!-- Mục 4 -->
  <rect x="190" y="410" width="32" height="32" rx="8" fill="#0c2a1e" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="206" y="431" text-anchor="middle" fill="#2ecc71" font-size="15" font-weight="900">✓</text>
  <rect x="234" y="410" width="430" height="32" rx="8" fill="#071e10" stroke="#1e8449" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="431" fill="#d7bde2" font-size="13.5">
    <tspan font-weight="600">Đủ điều kiện </tspan><tspan fill="#9b59b6" font-weight="700">(xi-nhan + gương)</tspan><tspan fill="#2ecc71" font-weight="700"> → được rẽ</tspan>
  </text>

  <!-- Hộp điều luật -->
  <rect x="190" y="456" width="520" height="62" rx="12" fill="#07040f" stroke="#9b59b6" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="190" y="456" width="4" height="62" rx="2" fill="#9b59b6" opacity="0.9"/>
  <text x="450" y="475" text-anchor="middle" fill="#c39bd3" font-size="11" font-weight="700" letter-spacing="1.5">CƠ SỞ PHÁP LÝ — LUẬT 36/2024/QH15</text>
  <text x="225" y="491" fill="#a881c4" font-size="13">
    <tspan fill="white" font-size="18" font-weight="900" letter-spacing="1.5">ĐIỀU 14</tspan><tspan> — Vượt xe &amp; nhường đường cho xe xin vượt</tspan>
  </text>
  <text x="225" y="510" fill="#a881c4" font-size="13">
    <tspan fill="white" font-size="18" font-weight="900" letter-spacing="1.5">ĐIỀU 15</tspan><tspan> — Chuyển hướng xe (rẽ trái, rẽ phải, quay đầu)</tspan>
  </text>

  <!-- Nút bắt đầu -->
  <rect x="190" y="532" width="520" height="48" rx="12" fill="#07150a" stroke="#2ecc71" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="190" y="532" width="520" height="48" rx="12" fill="none" stroke="#2ecc71" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="10,6"/>
  <rect x="210" y="542" width="32" height="28" rx="7" fill="#0d2e12" stroke="#2ecc71" stroke-width="2"/>
  <text x="226" y="561" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="900">1</text>
  <text x="454" y="562" text-anchor="middle" fill="white" font-size="15" font-weight="700" letter-spacing="1">Nhấn 1 khi sẵn sàng bắt đầu</text>
  <text x="686" y="562" text-anchor="middle" fill="#2ecc71" font-size="22" filter="url(#glowSoft)">▶</text>

  <text x="450" y="628" text-anchor="middle" fill="#2e1845" font-size="12">VR Smart Traffic Instructor — Scene 3 · Xi-nhan và kiểm tra gương</text>
</svg>
